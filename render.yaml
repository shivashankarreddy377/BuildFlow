services:
  - type: web
    name: developer-productivity-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:h2:file:/tmp/devprodplat;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER"
      - key: SPRING_DATASOURCE_USERNAME
        value: "sa"
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: APP_CORS_ALLOWED_ORIGIN
        value: "*"
      - key: PORT
        value: "8080"

  - type: web
    name: developer-productivity-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: developer-productivity-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
